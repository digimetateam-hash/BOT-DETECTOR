<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <!-- M3 Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#1C2541" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3873C4" />
      <stop offset="50%" stop-color="#0061A4" />
      <stop offset="100%" stop-color="#00477B" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#55A5FF" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#0061A4" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#002D57" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="botGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B" />
      <stop offset="100%" stop-color="#BA1A1A" />
    </linearGradient>

    <linearGradient id="organicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ECCA3" />
      <stop offset="100%" stop-color="#00875A" />
    </linearGradient>

    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03" />
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow3d" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- 3D Isometric Base Grid -->
  <g opacity="0.18">
    <path d="M100 350 L600 590 L1100 350 L600 110 Z" fill="none" stroke="#3873C4" stroke-width="1.5" />
    <path d="M200 350 L600 540 L1000 350 L600 160 Z" fill="none" stroke="#3873C4" stroke-width="1.2" />
    <path d="M300 350 L600 490 L900 350 L600 210 Z" fill="none" stroke="#3873C4" stroke-width="1.2" />
    <path d="M400 350 L600 440 L800 350 L600 260 Z" fill="none" stroke="#3873C4" stroke-width="1.2" />
    <!-- Grid Lines -->
    <line x1="600" y1="110" x2="600" y2="590" stroke="#3873C4" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="100" y1="350" x2="1100" y2="350" stroke="#3873C4" stroke-width="1" stroke-dasharray="4 4" />
  </g>

  <!-- 3D Floating Isometric Platform Base -->
  <g filter="url(#shadow3d)">
    <!-- Platform Top -->
    <polygon points="600,240 880,380 600,520 320,380" fill="url(#glassCard)" stroke="#55A5FF" stroke-width="2" stroke-opacity="0.4" />
    <!-- Platform Left Depth -->
    <polygon points="320,380 600,520 600,545 320,405" fill="#002D57" fill-opacity="0.8" stroke="#3873C4" stroke-opacity="0.3" />
    <!-- Platform Right Depth -->
    <polygon points="600,520 880,380 880,405 600,545" fill="#001F3F" fill-opacity="0.9" stroke="#3873C4" stroke-opacity="0.3" />
  </g>

  <!-- Connection Lines in 3D Space -->
  <g stroke-linecap="round">
    <!-- Coordinated Bot Swarm Edges (Red Warning) -->
    <line x1="390" y1="310" x2="480" y2="270" stroke="#FF6B6B" stroke-width="3" stroke-opacity="0.7" stroke-dasharray="6 4" filter="url(#softGlow)" />
    <line x1="480" y1="270" x2="430" y2="200" stroke="#FF6B6B" stroke-width="3" stroke-opacity="0.8" filter="url(#softGlow)" />
    <line x1="390" y1="310" x2="430" y2="200" stroke="#FF6B6B" stroke-width="2.5" stroke-opacity="0.6" />
    <line x1="430" y1="200" x2="520" y2="170" stroke="#FF6B6B" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="4 4" />

    <!-- Organic Account Edges (Green/Teal Verification) -->
    <line x1="720" y1="280" x2="800" y2="230" stroke="#4ECCA3" stroke-width="2.5" stroke-opacity="0.8" filter="url(#softGlow)" />
    <line x1="800" y1="230" x2="760" y2="160" stroke="#4ECCA3" stroke-width="2.5" stroke-opacity="0.8" />
    <line x1="720" y1="280" x2="760" y2="160" stroke="#4ECCA3" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="5 3" />
    <line x1="720" y1="280" x2="680" y2="340" stroke="#4ECCA3" stroke-width="2" stroke-opacity="0.5" />
  </g>

  <!-- 3D CENTRAL DEFENSE SHIELD (Material Design 3 Elevated Shield) -->
  <g filter="url(#shadow3d)">
    <!-- Outer Shield Ambient Aura -->
    <path d="M600 130 Q740 170 730 330 Q710 440 600 490 Q490 440 470 330 Q460 170 600 130 Z"
          fill="none" stroke="#55A5FF" stroke-width="4" stroke-opacity="0.6" filter="url(#glow)" />

    <!-- 3D Shield Glass Body -->
    <path d="M600 140 Q725 180 715 325 Q695 425 600 475 Q505 425 485 325 Q475 180 600 140 Z"
          fill="url(#shieldGrad)" stroke="#A0C9FF" stroke-width="3" stroke-opacity="0.8" />

    <!-- Shield 3D Specular Highlight (Left Curved Bevel) -->
    <path d="M600 145 Q515 185 500 320 Q515 415 600 465 Q530 405 520 315 Q530 195 600 145 Z"
          fill="#FFFFFF" fill-opacity="0.25" />

    <!-- Central AI Core / Radar Icon -->
    <circle cx="600" cy="305" r="48" fill="#001F3F" stroke="#55A5FF" stroke-width="2.5" filter="url(#softGlow)" />
    <circle cx="600" cy="305" r="32" fill="#00477B" stroke="#A0C9FF" stroke-width="2" />
    <circle cx="600" cy="305" r="14" fill="#FFFFFF" filter="url(#glow)" />

    <!-- 3D Core Crosshair Rays -->
    <line x1="600" y1="245" x2="600" y2="365" stroke="#A0C9FF" stroke-width="2.5" stroke-opacity="0.7" stroke-dasharray="3 3" />
    <line x1="540" y1="305" x2="660" y2="305" stroke="#A0C9FF" stroke-width="2.5" stroke-opacity="0.7" stroke-dasharray="3 3" />
  </g>

  <!-- 3D FLOATING NODES (Bot Clusters vs Organic) -->
  <!-- Bot Swarm Nodes (Red Warning) -->
  <g filter="url(#shadow3d)">
    <!-- Node 1 -->
    <circle cx="390" cy="310" r="22" fill="url(#botGrad)" filter="url(#softGlow)" />
    <circle cx="390" cy="310" r="14" fill="#BA1A1A" />
    <path d="M384 304 L396 316 M396 304 L384 316" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />

    <!-- Node 2 -->
    <circle cx="480" cy="270" r="19" fill="url(#botGrad)" filter="url(#softGlow)" />
    <circle cx="480" cy="270" r="12" fill="#BA1A1A" />

    <!-- Node 3 -->
    <circle cx="430" cy="200" r="24" fill="url(#botGrad)" filter="url(#glow)" />
    <circle cx="430" cy="200" r="15" fill="#780000" />
    <text x="430" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle">BOT</text>

    <!-- Node 4 -->
    <circle cx="520" cy="170" r="16" fill="url(#botGrad)" filter="url(#softGlow)" />
  </g>

  <!-- Organic Account Nodes (Green Verified) -->
  <g filter="url(#shadow3d)">
    <!-- Node A -->
    <circle cx="720" cy="280" r="22" fill="url(#organicGrad)" filter="url(#softGlow)" />
    <path d="M713 280 L718 285 L728 274" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Node B -->
    <circle cx="800" cy="230" r="24" fill="url(#organicGrad)" filter="url(#glow)" />
    <circle cx="800" cy="230" r="15" fill="#006C47" />
    <path d="M793 230 L798 235 L808 224" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Node C -->
    <circle cx="760" cy="160" r="18" fill="url(#organicGrad)" filter="url(#softGlow)" />

    <!-- Node D -->
    <circle cx="680" cy="340" r="16" fill="url(#organicGrad)" filter="url(#softGlow)" />
  </g>

  <!-- 3D MATERIAL DESIGN 3 FLOATING CARDS (Glassmorphism & Tonal Surface) -->
  <!-- Floating Card Left: Bot Detection Analysis -->
  <g filter="url(#shadow3d)" transform="translate(140, 160)">
    <!-- M3 Rounded Card Container -->
    <rect width="230" height="95" rx="16" fill="#1C2541" fill-opacity="0.85" stroke="#FF6B6B" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="34" cy="36" r="14" fill="#BA1A1A" fill-opacity="0.3" />
    <text x="34" y="41" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" text-anchor="middle">⚠️</text>
    <text x="58" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FFB4AB">Klaster Terkoordinasi</text>
    <text x="58" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#D1E4FF" opacity="0.8">Co-Retweet Semrawut</text>
    <!-- Progress Indicator Bar -->
    <rect x="22" y="66" width="186" height="6" rx="3" fill="#3B4861" />
    <rect x="22" y="66" width="155" height="6" rx="3" fill="#FF5449" />
    <text x="186" y="82" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#FFB4AB" text-anchor="end">Skor: 0.88</text>
  </g>

  <!-- Floating Card Right: Verified Accuracy Metrics -->
  <g filter="url(#shadow3d)" transform="translate(830, 290)">
    <!-- M3 Rounded Card Container -->
    <rect width="230" height="95" rx="16" fill="#1C2541" fill-opacity="0.85" stroke="#4ECCA3" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="34" cy="36" r="14" fill="#005234" fill-opacity="0.4" />
    <text x="34" y="41" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" text-anchor="middle">🛡️</text>
    <text x="58" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#6CDBAC">Explainable AI (SHAP)</text>
    <text x="58" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#D1E4FF" opacity="0.8">Transparan & Terukur</text>
    <!-- Progress Indicator Bar -->
    <rect x="22" y="66" width="186" height="6" rx="3" fill="#3B4861" />
    <rect x="22" y="66" width="168" height="6" rx="3" fill="#4ECCA3" />
    <text x="186" y="82" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#6CDBAC" text-anchor="end">F1-Score: ≥ 0.80</text>
  </g>

  <!-- Floating Card Bottom: Multi-Layer Multiplex -->
  <g filter="url(#shadow3d)" transform="translate(485, 475)">
    <rect width="230" height="58" rx="29" fill="#002D57" fill-opacity="0.9" stroke="#55A5FF" stroke-width="2" />
    <circle cx="30" cy="29" r="16" fill="#0061A4" />
    <text x="30" y="35" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" text-anchor="middle">🕸️</text>
    <text x="58" y="27" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#D1E4FF">Graf Koordinasi Multiplex</text>
    <text x="58" y="43" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#A0C9FF">4 Lapisan Sinyal · Leiden</text>
  </g>

  <!-- Floating Tech Particles -->
  <circle cx="280" cy="120" r="3" fill="#55A5FF" opacity="0.6" filter="url(#softGlow)" />
  <circle cx="320" cy="480" r="4" fill="#55A5FF" opacity="0.4" filter="url(#softGlow)" />
  <circle cx="920" cy="140" r="3.5" fill="#4ECCA3" opacity="0.5" filter="url(#softGlow)" />
  <circle cx="870" cy="460" r="3" fill="#FF6B6B" opacity="0.5" filter="url(#softGlow)" />
</svg>
